name: Query service integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['test/64-ingestion-roundtrip']

permissions:
  contents: read

jobs:
  ingestion-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: brainkb_integration
          POSTGRES_USER: brainkb_test
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      oxigraph:
        image: ghcr.io/oxigraph/oxigraph:0.4.0-rc.1
        ports: ['17878:7878']
    defaults:
      run:
        working-directory: query_service
    env:
      BRAINKB_INTEGRATION: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      QUERY_SERVICE_JWT_SECRET_KEY: brainkb-local-test-secret
      JWT_POSTGRES_DATABASE_HOST_URL: 127.0.0.1
      JWT_POSTGRES_DATABASE_PORT: '55432'
      JWT_POSTGRES_DATABASE_NAME: brainkb_integration
      JWT_POSTGRES_DATABASE_USER: brainkb_test
      JWT_POSTGRES_DATABASE_PASSWORD: disposable-test-password
      GRAPHDATABASE_HOSTNAME: http://127.0.0.1:17878
      GRAPHDATABASE_PORT: '17878'
      GRAPHDATABASE_TYPE: OXIGRAPH
      GRAPHDATABASE_USERNAME: test
      GRAPHDATABASE_PASSWORD: test
      TRACK_TRIPLE_DELTAS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest PyYAML requests python-dotenv
      - name: Wait for Oxigraph
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --get --data-urlencode 'query=ASK {}' http://127.0.0.1:17878/query; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise ingestion and provenance twice
        run: |
          python -m pytest integration_tests -q --junitxml=integration-results.xml
          python -m pytest integration_tests -q
      - name: Verify assertions detect missing and misdirected writes
        run: |
          for fault in skip-merge wrong-graph skip-provenance; do
            set +e
            BRAINKB_INTEGRATION_FAULT="$fault" python -m pytest integration_tests -q -k round_trip > "fault-$fault.log" 2>&1
            result=$?
            set -e
            cat "fault-$fault.log"
            if [ "$result" -ne 1 ] || ! grep -q '1 failed' "fault-$fault.log"; then
              echo "Expected a failed round-trip assertion for $fault"
              exit 1
            fi
          done
      - name: Capture service logs
        if: failure()
        run: |
          docker logs '${{ job.services.postgres.id }}' > postgres.log 2>&1
          docker logs '${{ job.services.oxigraph.id }}' > oxigraph.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-diagnostics
          path: |
            query_service/integration-results.xml
            query_service/postgres.log
            query_service/oxigraph.log
            query_service/fault-*.log
